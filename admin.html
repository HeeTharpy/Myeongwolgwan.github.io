<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>명월관 프로필 관리자</title>
  <link rel="stylesheet" href="admin.css">
</head>

<body>
<main>

  <section class="login" id="loginBox">
    <img src="assets/myeongwol-logo.png" alt="명월관">

    <h1>프로필 관리자</h1>

    <input
      id="loginId"
      placeholder="아이디"
      autocomplete="username"
    >

    <input
      id="loginPw"
      type="password"
      placeholder="비밀번호"
      autocomplete="current-password"
    >

    <button id="loginBtn">로그인</button>

    <p>명월관 관리자 전용 페이지입니다.</p>
  </section>


  <div class="admin" id="adminWrap" hidden>

    <header>
      <div>
        <small>MYEONGWOLGWAN ADMIN</small>
        <h1>관리사 프로필 관리</h1>
      </div>

      <a href="index.html#therapist" target="_blank">
        홈페이지 확인
      </a>
    </header>


    <section class="panel">

      <h2>프로필 추가 / 수정</h2>

      <input id="managerId" type="hidden">

      <div class="grid">

        <label>
          이름
          <input
            id="name"
            placeholder="예: 매화"
          >
        </label>

        <label>
          나이
          <input
            id="age"
            placeholder="예: 24세"
          >
        </label>

        <label>
          키
          <input
            id="height"
            placeholder="예: 165cm"
          >
        </label>

        <label>
          스펙
          <input
            id="body"
            placeholder="예: 49kg / C컵"
          >
        </label>

        <label>
          출근시간
          <input
            id="work"
            placeholder="예: 14:00 ~ 00:00"
          >
        </label>

        <label>
          대표사진
          <input
            id="photo"
            type="file"
            accept="image/*"
          >
        </label>

      </div>


      <label>
        소개글

        <textarea
          id="intro"
          placeholder="간단한 소개를 입력하세요."
        ></textarea>
      </label>


      <div class="preview" id="preview">
        사진 미리보기
      </div>


      <div class="actions">

        <button id="saveBtn">
          프로필 저장
        </button>

        <button
          class="line"
          id="clearBtn"
        >
          입력 비우기
        </button>

      </div>

    </section>


    <section class="panel">

      <div class="panel-head">

        <h2>등록된 관리사</h2>

        <span id="count">
          0명
        </span>

      </div>

      <div id="managerList"></div>

    </section>

  </div>

</main>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script src="firebase-config.js?v=2"></script>
<script src="admin.js?v=2"></script>

</body>
</html>
